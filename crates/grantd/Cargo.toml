[package]
name = "grantd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
blocklog = { path = "../blocklog" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"

[dev-dependencies]
tempfile = "3.27.0"
